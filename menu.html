<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Available Items</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      overflow-x: auto;
    }

    .chip {
      background: #d9e3d9;
      color: var(--text-dark);
      border: none;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .chip.active {
      background: var(--primary-pill);
      color: #fff;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      overflow-y: auto;
    }

    .item {
      background: var(--item-bg);
      border: 1px solid #0e630e;
      border-radius: 18px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item.off {
      background: #fce8e6;
      border-color: #e57373;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
    }

    .desc {
      font-size: 12px;
      color: #485648;
    }

    .price {
      font-weight: 700;
      margin-top: 4px;
    }
  </style>
</head>

<body>
  <div class="card card-full">
    <div class="header">
      <button class="back-btn" onclick="location.href='home.html'">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
        </svg>
      </button>
      <h2>Available Items</h2>
      <p>Food &amp; beverage status</p>
    </div>

    <div class="bar" id="catBar">
      <button class="chip active" onclick="setCat('all',this)">All</button>
      <button class="chip" onclick="setCat('food',this)">Food</button>
      <button class="chip" onclick="setCat('beverage',this)">Beverages</button>
      <button class="chip" onclick="setCat('snacks',this)">Snacks</button>
    </div>

    <div class="list" id="menuList"></div>
  </div>


  <script src="store.js"></script>

  <script>
    var selectedCategory = 'all';

    function render() {
      getMenuItems(function (items) {
        var listContainer = document.getElementById('menuList');
        listContainer.innerHTML = '';

        (items || []).forEach(function (item) {
          if (selectedCategory !== 'all' && item.category !== selectedCategory) {
            return;
          }

          var isSoldOut = !item.isAvailable || item.qty <= 0;

          var itemCard = document.createElement('div');
          itemCard.className = 'item' + (isSoldOut ? ' off' : '');

          itemCard.innerHTML =
            '<div>' +
              '<div class="title">' + item.name + '</div>' +
              '<div class="desc">' + item.desc + '</div>' +
              '<div class="price">₹' + item.price + '</div>' +
            '</div>' +
            '<div class="qty-box ' + (isSoldOut ? 'zero' : '') + '">' +
              (isSoldOut ? 'Sold Out' : 'Qty: ' + item.qty) +
            '</div>';

          listContainer.appendChild(itemCard);
        });
      });
    }

    function setCat(category, clickedChip) {
      selectedCategory = category;

      document.querySelectorAll('.chip').forEach(function (chip) {
        chip.classList.remove('active');
      });

      clickedChip.classList.add('active');

      render();
    }

    render();
  </script>
</body>

</html>

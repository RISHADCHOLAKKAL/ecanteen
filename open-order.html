<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Open Order</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      overflow-y: auto;
    }

    .item {
      background: var(--item-bg);
      border: 1px solid #0e630e;
      border-radius: 18px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .item.off {
      background: #fce8e6;
      border-color: #e57373;
      opacity: 0.7;
    }

    .ctrl {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qbtn {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      border: none;
      background: var(--primary-pill);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }

    .qbtn:disabled {
      background: #ccc;
    }

    .foot {
      margin-top: 10px;
      padding: 12px;
      background: #fff;
      border-radius: 16px;
      border: 1px solid #d9e3d9;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>

<body>
  <div class="card card-full">
    <div class="header">
      <button class="back-btn" onclick="location.href='home.html'">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
        </svg>
      </button>
      <h2>Open Order</h2>
      <p>Select items to order</p>
    </div>

    <div class="list" id="orderList"></div>

    <div class="foot">
      <div>
        <div id="cnt" style="font-size:12px;color:#6b7a6b;font-weight:bold;">0 Items</div>
        <div id="tot" style="font-size:18px;font-weight:800;">Total: ₹0</div>
      </div>
      <button class="submit-btn" style="width:auto;padding:10px 18px;margin:0;" onclick="placeOrder()">Place Order</button>
    </div>
  </div>


  <script src="store.js"></script>

  <script>
    var cart = {};
    var cachedItems = [];

    function render() {
      getMenuItems(function (items) {
        cachedItems = items || [];

        var listContainer = document.getElementById('orderList');
        listContainer.innerHTML = '';

        cachedItems.forEach(function (item) {
          if (!(item.id in cart)) {
            cart[item.id] = 0;
          }

          var isSoldOut = !item.isAvailable || item.qty <= 0;

          var itemCard = document.createElement('div');
          itemCard.className = 'item' + (isSoldOut ? ' off' : '');

          itemCard.innerHTML =
            '<div>' +
              '<div style="font-weight:bold;">' + item.name + '</div>' +
              '<div style="font-size:13px;color:#384d39;">' +
                (isSoldOut ? 'Sold Out' : '₹' + item.price) +
              '</div>' +
            '</div>' +

            '<div class="ctrl">' +
              (isSoldOut
                ? '<button class="qbtn" disabled>+</button>'
                : '<button class="qbtn" onclick="updateQty(' + item.id + ',-1)">-</button>' +
                  '<span style="font-weight:bold;min-width:16px;text-align:center;" id="q-' + item.id + '">' + cart[item.id] + '</span>' +
                  '<button class="qbtn" onclick="updateQty(' + item.id + ',1,' + item.qty + ')">+</button>'
              ) +
            '</div>';

          listContainer.appendChild(itemCard);
        });

        calculateTotal();
      });
    }

    function updateQty(id, delta, max) {
      if (delta > 0 && cart[id] >= max) {
        alert('Stock limit reached');
        return;
      }

      cart[id] = Math.max(0, (cart[id] || 0) + delta);

      var quantityDisplay = document.getElementById('q-' + id);
      if (quantityDisplay) {
        quantityDisplay.textContent = cart[id];
      }

      calculateTotal();
    }

    function calculateTotal() {
      var totalItems = 0;
      var totalPrice = 0;

      cachedItems.forEach(function (item) {
        var quantity = cart[item.id] || 0;
        totalItems += quantity;
        totalPrice += quantity * item.price;
      });

      document.getElementById('cnt').textContent = totalItems + ' Items';
      document.getElementById('tot').textContent = 'Total: ₹' + totalPrice;

      return totalPrice;
    }

    function placeOrder() {
      var total = calculateTotal();

      var orderedItems = [];
      cachedItems.forEach(function (item) {
        if (cart[item.id] > 0) {
          orderedItems.push({
            name:  item.name,
            qty:   cart[item.id],
            price: item.price
          });
        }
      });

      if (orderedItems.length === 0) {
        alert('Select at least 1 item');
        return;
      }

      recordSale({
        total: total,
        items: orderedItems
      }, function () {
        alert('Order Placed!');
        location.href = 'home.html';
      });
    }

    render();
  </script>
</body>

</html>

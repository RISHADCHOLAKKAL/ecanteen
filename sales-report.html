<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Report</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }

    .box {
      background: var(--item-bg);
      border: 1px solid #0e630e;
      border-radius: 16px;
      padding: 12px;
    }

    .box .lbl {
      font-size: 11px;
      font-weight: bold;
      color: #384d39;
      text-transform: uppercase;
    }

    .box .val {
      font-size: 20px;
      font-weight: 800;
    }

    .bar {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
      overflow-x: auto;
    }

    .chip {
      background: #d9e3d9;
      border: none;
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .chip.active {
      background: var(--primary-pill);
      color: #fff;
    }

    .nav {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      font-weight: bold;
    }

    .nav button {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 2px 8px;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      overflow-y: auto;
    }

    .card-item {
      background: var(--item-bg);
      border: 1px solid #0e630e;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="card card-full">
    <div class="header">
      <button class="back-btn" onclick="location.href='admin-home.html'">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
        </svg>
      </button>
      <h2>Sales Report</h2>
      <p id="pLabel">Overview</p>
    </div>

    <div class="grid">
      <div class="box">
        <div class="lbl">Revenue</div>
        <div class="val" id="rev">₹0</div>
      </div>
      <div class="box">
        <div class="lbl">Orders</div>
        <div class="val" id="cnt">0</div>
      </div>
    </div>

    <div class="bar" id="pBar">
      <button class="chip active" onclick="setPeriod('daily',this)">Daily</button>
      <button class="chip" onclick="setPeriod('weekly',this)">Weekly</button>
      <button class="chip" onclick="setPeriod('monthly',this)">Monthly</button>
      <button class="chip" onclick="setPeriod('yearly',this)">Yearly</button>
      <button class="chip" onclick="setPeriod('all',this)">All Time</button>
    </div>

    <div class="nav" id="dNav">
      <button onclick="shiftDate(-1)">◀</button>
      <span id="dLbl">Today</span>
      <button onclick="shiftDate(1)">▶</button>
    </div>

    <div class="list" id="salesList"></div>
  </div>


  <script src="store.js"></script>

  <script>
    var allSales = [];
    var period   = 'daily';
    var offset   = 0;

    function getRange() {
      var now = new Date();
      var startDate, endDate, label;

      if (period === 'daily') {
        startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() + offset);
        endDate   = new Date(startDate);
        endDate.setDate(endDate.getDate() + 1);

        if (offset === 0) {
          label = 'Today';
        } else if (offset === -1) {
          label = 'Yesterday';
        } else {
          label = startDate.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
        }

      } else if (period === 'weekly') {
        var dayOfWeek = now.getDay() || 7;
        startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate() - dayOfWeek + 1 + (offset * 7));
        endDate   = new Date(startDate);
        endDate.setDate(endDate.getDate() + 7);

        var lastDay = new Date(endDate - 864e5);
        label = startDate.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }) +
                ' – ' +
                lastDay.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });

      } else if (period === 'monthly') {
        startDate = new Date(now.getFullYear(), now.getMonth() + offset, 1);
        endDate   = new Date(now.getFullYear(), now.getMonth() + offset + 1, 1);

        label = startDate.toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });

      } else if (period === 'yearly') {
        startDate = new Date(now.getFullYear() + offset, 0, 1);
        endDate   = new Date(now.getFullYear() + offset + 1, 0, 1);

        label = startDate.getFullYear().toString();

      } else {
        startDate = new Date(0);
        endDate   = new Date(9999, 0, 1);
        label     = 'All Time';
      }

      return { s: startDate, e: endDate, l: label };
    }

    function render() {
      var range = getRange();

      document.getElementById('dLbl').textContent = range.l;
      document.getElementById('dNav').style.display = (period === 'all') ? 'none' : 'flex';
      document.getElementById('pLabel').textContent = range.l + ' overview';

      var filteredOrders = allSales.filter(function (order) {
        var orderDate = new Date(order.date);
        return orderDate >= range.s && orderDate < range.e;
      });

      var totalRevenue = 0;
      filteredOrders.forEach(function (order) {
        totalRevenue += parseInt(order.total) || 0;
      });

      document.getElementById('rev').textContent = '₹' + totalRevenue;
      document.getElementById('cnt').textContent = filteredOrders.length;

      var container = document.getElementById('salesList');

      if (filteredOrders.length === 0) {
        container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);">No orders found</div>';
      } else {
        container.innerHTML = '';
      }

      filteredOrders.forEach(function (order) {
        var itemsList = order.items.map(function (item) {
          return item.name + ' x' + item.qty;
        }).join(', ');

        var card = document.createElement('div');
        card.className = 'card-item';

        card.innerHTML =
          '<div class="row">' +
            '<span>' + order.order_code + '</span>' +
            '<span style="color:var(--text-muted);font-size:12px;">Open Order</span>' +
          '</div>' +

          '<div style="font-size:12px;color:var(--text-muted);">' + itemsList + '</div>' +

          '<div class="row" style="margin-top:4px;">' +
            '<span>' +
              (new Date(order.date)).toLocaleString('en-IN', {
                day: 'numeric',
                month: 'short',
                hour: '2-digit',
                minute: '2-digit'
              }) +
            '</span>' +
            '<span>₹' + order.total + '</span>' +
          '</div>';

        container.appendChild(card);
      });
    }

    function setPeriod(newPeriod, clickedElement) {
      period = newPeriod;
      offset = 0;
      setActiveChip(clickedElement, '#pBar');
      render();
    }

    function setActiveChip(clickedElement, parent) {
      var parentElement = (typeof parent === 'string')
        ? document.querySelector(parent)
        : parent;

      parentElement.querySelectorAll('.chip').forEach(function (chip) {
        chip.classList.remove('active');
      });

      clickedElement.classList.add('active');
    }

    function shiftDate(direction) {
      if (period !== 'all' && (offset + direction) <= 0) {
        offset += direction;
        render();
      }
    }

    getSalesHistory(function (sales) {
      allSales = sales || [];
      render();
    });
  </script>
</body>

</html>

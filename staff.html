<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Panel</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      overflow-y: auto;
    }

    .card-edit {
      background: var(--item-bg);
      border: 1px solid #0e630e;
      border-radius: 16px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .inp {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid #a8bca9;
      background: #fff;
      font-size: 13px;
      margin: 0;
    }

    .btn-act {
      padding: 6px 10px;
      border-radius: 8px;
      border: none;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-save {
      background: var(--primary-pill);
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal-box {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 18px;
      width: 90%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="card card-full">
    <div class="header">
      <button class="back-btn" onclick="location.href='admin-home.html'">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      </button>
      <h2>Manage Items</h2>
      <p>Edit stock &amp; price</p>
    </div>

    <button class="btn-full" style="padding:10px;margin-bottom:10px;" onclick="openAdd()">+ Add New Item</button>

    <div class="list" id="staffList"></div>
  </div>


  <div class="modal" id="addModal">
    <div class="modal-box">
      <h3 style="text-align:center;">Add Item</h3>

      <input type="text" id="newName" placeholder="Name">
      <input type="text" id="newDesc" placeholder="Description">
      <input type="number" id="newPrice" placeholder="Price">
      <input type="number" id="newQty" placeholder="Quantity">

      <select id="newCat" style="padding:8px;border-radius:10px;border:none;background:#d9e3d9;font-weight:bold;">
        <option value="food">Food</option>
        <option value="beverage">Beverage</option>
        <option value="snacks">Snacks</option>
      </select>

      <div class="row">
        <button class="btn-act" style="flex:1;background:#d9e3d9;" onclick="closeAdd()">Cancel</button>
        <button class="btn-save" style="flex:1;" onclick="addItem()">Save</button>
      </div>
    </div>
  </div>


  <script src="store.js"></script>

  <script>
    var items = [];

    function render() {
      getMenuItems(function(fetchedItems) {
        items = fetchedItems || [];

        var listContainer = document.getElementById('staffList');
        listContainer.innerHTML = '';

        items.forEach(function(item, index) {
          var isAvailable = item.isAvailable && item.qty > 0;

          var card = document.createElement('div');
          card.className = 'card-edit';

          card.innerHTML =
            '<div class="row">' +
              '<input class="inp" style="flex:1;font-weight:bold;" value="' + item.name + '" id="n-' + index + '">' +
              '<input type="number" class="inp" style="width:65px;" value="' + item.price + '" id="p-' + index + '">' +
            '</div>' +

            '<div class="row">' +
              '<input type="number" class="inp" style="width:65px;" value="' + item.qty + '" id="q-' + index + '">' +

              '<button class="btn-act" style="flex:1;background:' +
                (isAvailable ? '#e8f5e9;color:#2e7d32' : '#ffebee;color:#c62828') +
                ';" onclick="toggle(' + index + ')">' +
                (isAvailable ? 'Available' : 'Sold Out') +
              '</button>' +

              '<button class="btn-save" onclick="save(' + index + ')">Save</button>' +
            '</div>';

          listContainer.appendChild(card);
        });
      });
    }

    function openAdd() {
      document.getElementById('addModal').style.display = 'flex';
    }

    function closeAdd() {
      document.getElementById('addModal').style.display = 'none';
    }

    function addItem() {
      var name     = document.getElementById('newName').value.trim();
      var price    = parseInt(document.getElementById('newPrice').value) || 0;
      var quantity = parseInt(document.getElementById('newQty').value) || 0;

      if (!name || price <= 0) {
        alert('Enter valid name and price');
        return;
      }

      var newItem = {
        name:        name,
        desc:        document.getElementById('newDesc').value.trim() || 'Canteen item',
        price:       price,
        category:    document.getElementById('newCat').value,
        qty:         quantity,
        isAvailable: quantity > 0 ? 1 : 0
      };

      saveMenuItem(newItem, function() {
        closeAdd();
        render();
      });
    }

    function toggle(index) {
      var item = items[index];

      item.isAvailable = item.isAvailable ? 0 : 1;

      if (!item.isAvailable) {
        item.qty = 0;
      } else if (!item.qty) {
        item.qty = 10;
      }

      saveMenuItem(item, render);
    }

    function save(index) {
      var item = items[index];

      item.name  = document.getElementById('n-' + index).value.trim();
      item.price = parseInt(document.getElementById('p-' + index).value) || 0;
      item.qty   = parseInt(document.getElementById('q-' + index).value) || 0;

      item.isAvailable = item.qty > 0 ? 1 : 0;

      saveMenuItem(item, function() {
        alert('Saved!');
        render();
      });
    }

    render();
  </script>
</body>
</html>
